<!DOCTYPE html>
<!--Welcome To Yujal-search!-->
<!-- not publihsed yet btw-->
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yujal search</title>
    <link rel="icon" type="image/x-icon" href="https://github.com/King-yujal/Yujal/blob/main/Yujalserch.png?raw=true">
    <style>
        .logo {
            width: 150px; 
            height: 150px;
            border-radius: 50px; 
            padding: 10px 20px;
        }

        :root {
            color-scheme: light dark;
            --bg-color: light-dark(#ffffff, #121212);
            --text-color: light-dark(#333333, #f5f5f5);
            --btn-bg: light-dark(#25439C, #FFFFFF);
            --btn-text: light-dark(#ffffff, #121212);
        }

        [data-theme="light"] {
            color-scheme: light;
        }

        [data-theme="dark"] {
            color-scheme: dark;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: sans-serif;
            transition: background-color 0.3s, color 0.3s;
            text-align: center; 
        }

        button {
            background-color: var(--btn-bg);
            color: var(--btn-text);
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .search-size {
            width: 500px;
            height: 45px;
            border-radius: 50px; 
            border: 1px solid #ccc;
            padding: 0 20px;
            font-size: 16px;
            outline: none;
        }

        .search-button {
            width: 80px;
            height: 50px;
            border-radius: 50px; 
            padding: 10px 20px;
            cursor: pointer;
            vertical-align: middle;
            margin-top: 15px;
        }

        /* Results Styling Wrapper */
        .results-wrapper {
            max-width: 600px; 
            margin: 30px auto; 
            text-align: left; 
            padding: 0 20px;
        }

        .result-item {
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(128, 128, 128, 0.2);
        }

        .result-item h3 {
            margin: 0 0 5px 0;
        }

        .result-item a {
            color: #25439C; 
            text-decoration: none;
        }

        .result-item a:hover {
            text-decoration: underline;
        }

        .result-item small {
            color: green; 
            display: block; 
            word-break: break-all;
            margin-bottom: 5px;
        }

        .result-item p {
            margin: 0; 
            font-size: 14px; 
            opacity: 0.8;
            line-height: 1.4;
        }
    </style>
</head>
<body>
     
    <button id="theme-toggle">Switch Theme</button>
    <br> <br> <br>

    <img src="https://github.com/King-yujal/Yujal/blob/main/Yujalserch.png?raw=true" class="logo" alt="Yujal Search Logo">
    <br><br>

    <!-- Clean, Single Form Element Linked to JavaScript -->
    <form class="search-container" onsubmit="searchYujalIndex(); return false;">
        <input class="search-size" autocorrect="on" type="text" id="destination" placeholder="Type search keywords...">
        <br>
        <input id="myBtn" type="image" src="https://github.com/King-yujal/Yujal/blob/main/button.png?raw=true" class="search-button" alt="Search Button">
    </form>

    <!-- Target Area Where Search Results Will Appear Live -->
    <div id="results-display" class="results-wrapper"></div>

    <!-- Theme Control Logic Script -->
    <script>
        const toggleBtn = document.getElementById('theme-toggle');
        const rootElement = document.documentElement;

        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) {
            rootElement.setAttribute('data-theme', savedTheme);
        }

        toggleBtn.addEventListener('click', () => {
            const currentTheme = rootElement.getAttribute('data-theme') || 
                                 (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            
            rootElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        });
    </script>

    <!-- Live Search Engine Fetch Connector -->
    <script>
        async function searchYujalIndex() {
            const query = document.getElementById('destination').value.trim();
            const displayArea = document.getElementById('results-display');
            
            if (!query) return;
            displayArea.innerHTML = "<em>Searching index database...</em>";

            try {
                // Fixed connection pathway using localhost instead of raw 127.0.0.1
             const response = await fetch(`https://onrender.com${encodeURIComponent(query)};`)
                const matches = await response.json();

                displayArea.innerHTML = ""; // Wipe loading announcement text clean

                if (matches.length === 0) {
                    displayArea.innerHTML = "<p style='color: gray; text-align: center;'>No indexed results found matching that term.</p>";
                    return;
                }

                // Dynamically stitch matched database components directly to your user screen layout
                matches.forEach(item => {
                    const block = document.createElement('div');
                    block.className = 'result-item';
                    block.innerHTML = `
                        <h3><a href="${item.url}" target="_blank">${item.title}</a></h3>
                        <small>${item.url}</small>
                        <p>${item.snippet}</p>
                    `;
                    displayArea.appendChild(block);
                });

            } catch (err) {
                displayArea.innerHTML = "<p style='color: red; text-align: center;'>Could not link up with Search Engine Backend Server. (Make sure server.py is running!)</p>";
            }
        }
    </script>
</body>
</html>
